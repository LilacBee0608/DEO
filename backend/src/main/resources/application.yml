# ============================================================
# 仿哔哩哔哩后端配置
# ============================================================
server:
  port: 8081              # 端口避开 Steam 占用的 8080
  servlet:
    context-path: /api   # 统一接口前缀: http://localhost:8081/api

spring:
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/deo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 000922
  # 文件上传大小限制(视频上传用)
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bili.demo.entity
  configuration:
    map-underscore-to-camel-case: true   # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印SQL
  global-config:
    db-config:
      id-type: auto   # 主键自增

# JWT 自定义配置
jwt:
  secret: bili-demo-secret-key-2026-please-change-in-production-xxx
  expiration: 86400000   # token 有效期 24小时(毫秒)
  header: Authorization   # 请求头字段名
  prefix: "Bearer "       # token 前缀

# 视频文件存储目录(上传视频时使用)
storage:
  video-dir: ${user.dir}/videos
  cover-dir: ${user.dir}/covers
  logo-dir: ${user.dir}/logo
  url-prefix: /files      # 静态资源访问前缀

# 前端自动启动配置(后端启动时自动执行 npm run dev)
frontend:
  # 前端项目根目录(留空则自动探测:从后端工作目录向上查找 frontend 子目录)
  # 若自动探测失败,可在此填写绝对路径,例如: d:/WebBuilding/GitDEO/frontend
  dir:
  # 是否在后端启动时自动启动前端开发服务器
  auto-start: true
  # 自动启动命令(无需修改,默认 npm run dev)
  command: npm run dev
